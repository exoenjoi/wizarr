name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch: {}

jobs:
  sync:
    if: github.repository != 'wizarrrr/wizarr'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Fast-forward main to upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync ${{ github.repository }} --source wizarrrr/wizarr --branch main
